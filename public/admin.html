<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Технострелка — модерация</title>
<style>
  :root {
    --bg:     #0f0a14;
    --bg2:    #1a1022;
    --purple: #4b2861;
    --purple2:#7a3fa0;
    --green:  #22c55e;
    --red:    #ef4444;
    --text:   #fff;
    --muted:  #a79ab3;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 0%, #241432 0%, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,6,14,0.75);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand .title {
    font-size: 15px; letter-spacing: 3px;
    text-transform: uppercase; opacity: 0.7;
  }
  .brand .stand {
    font-size: 20px; font-weight: 800; color: #d6b7ef;
  }

  .hdr-right { display: flex; align-items: center; gap: 18px; font-size: 14px; }
  .queue-badge {
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    padding: 8px 14px; border-radius: 999px;
    font-weight: 700; font-size: 14px;
  }
  .conn { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #555; box-shadow: 0 0 8px #555;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.on  { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  .dot.off { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

  main {
    position: absolute;
    top: 64px; left: 0; right: 0; bottom: 120px;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .photo-frame {
    position: relative;
    max-width: 100%; max-height: 100%;
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: none;
    animation: fadeIn 0.35s ease;
  }
  .photo-frame.visible { display: block; }
  .photo-frame img {
    display: block;
    max-width: calc(100vw - 48px);
    max-height: calc(100vh - 64px - 120px - 48px);
    object-fit: contain; background: #000;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }

  .empty {
    text-align: center; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .empty .icon {
    font-size: 80px; opacity: 0.3;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }
  .empty .text { font-size: 20px; font-weight: 500; }
  .empty .sub  { font-size: 14px; opacity: 0.7; }

  .access-denied {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg); z-index: 100;
    text-align: center; padding: 20px;
  }
  .access-denied .icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
  .access-denied h2 { font-size: 24px; margin-bottom: 8px; }
  .access-denied p  { color: var(--muted); font-size: 14px; max-width: 400px; }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    padding: 16px 24px 20px;
    display: flex; gap: 16px;
    background: rgba(10,6,14,0.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
  }

  .action-btn {
    flex: 1;
    border: none; border-radius: 16px;
    font-size: 22px; font-weight: 800;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    transition: transform 0.08s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    letter-spacing: 0.5px;
  }
  .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .action-btn:not(:disabled):hover  { box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .action-btn:not(:disabled):active { transform: scale(0.98); }

  .btn-reject  { background: linear-gradient(135deg, #b91c1c, var(--red)); }
  .btn-approve { background: linear-gradient(135deg, #15803d, var(--green)); }

  .key-hint {
    display: inline-block;
    font-size: 12px;
    background: rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 2px 8px; margin-left: 6px;
    font-weight: 600; letter-spacing: 1px;
  }

  .toast {
    position: fixed;
    top: 80px; right: 20px;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; transform: translateX(40px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(0); }

  @media (max-width: 640px) {
    header { height: 56px; padding: 0 14px; }
    .brand .title { font-size: 12px; letter-spacing: 2px; }
    .brand .stand { font-size: 16px; }
    main { top: 56px; bottom: 110px; padding: 12px; }
    .photo-frame img {
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 56px - 110px - 24px);
    }
    footer { height: 110px; padding: 12px; gap: 10px; }
    .action-btn { font-size: 17px; border-radius: 12px; }
    .key-hint { display: none; }
    .hdr-right { gap: 10px; }
    .queue-badge { font-size: 12px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="title">Модерация</div>
    <div class="stand" id="standLabel">Стенд №—</div>
  </div>
  <div class="hdr-right">
    <div class="queue-badge">В очереди: <span id="queueCount">0</span></div>
    <div class="conn">
      <span class="dot off" id="connDot"></span>
      <span id="connText">оффлайн</span>
    </div>
  </div>
</header>

<main>
  <div class="empty" id="emptyState">
    <div class="icon">🕊️</div>
    <div class="text">Нет фото на модерации</div>
    <div class="sub">Как только участник отправит фото — оно появится здесь</div>
  </div>

  <div class="photo-frame" id="photoFrame">
    <img id="photoImg" alt="Фото на модерации">
  </div>
</main>

<footer>
  <button class="action-btn btn-reject" id="btnReject" disabled>
    ✕ Удалить
    <span class="key-hint">←</span>
  </button>
  <button class="action-btn btn-approve" id="btnApprove" disabled>
    ✓ Отправить на экран
    <span class="key-hint">→</span>
  </button>
</footer>

<div class="toast" id="toast">📸 Новое фото в очереди</div>

<script>
  // =====================================================
  //   ПАРСИНГ ТОКЕНА ИЗ URL
  // =====================================================
  // URL: /admin/1-a7k2p  →  stand=1, token="1-a7k2p"
  // URL: /admin/3-a7k2p  →  stand=3, token="3-a7k2p"
  const pathMatch = location.pathname.match(/^\/admin\/(\d+)-([a-zA-Z0-9]{3,10})$/);
  const STAND = pathMatch ? parseInt(pathMatch[1], 10) : null;
  const TOKEN = pathMatch ? pathMatch[0].replace('/admin/', '') : null;

  // ---- DOM ----
  const queueCountEl = document.getElementById('queueCount');
  const emptyState   = document.getElementById('emptyState');
  const photoFrame   = document.getElementById('photoFrame');
  const photoImg     = document.getElementById('photoImg');
  const btnReject    = document.getElementById('btnReject');
  const btnApprove   = document.getElementById('btnApprove');
  const connDot      = document.getElementById('connDot');
  const connText     = document.getElementById('connText');
  const toast        = document.getElementById('toast');

  document.getElementById('standLabel').textContent = STAND ? ('Стенд №' + STAND) : '—';

  // =====================================================
  //   ПРОВЕРКА ДОСТУПА
  // =====================================================
  if (!TOKEN) {
    showAccessDenied('Неверная ссылка', 'URL должен быть вида /admin/1-секрет');
  }

  function showAccessDenied(title, subtitle) {
    const div = document.createElement('div');
    div.className = 'access-denied';
    div.innerHTML = `
      <div class="icon">🔒</div>
      <h2>${title}</h2>
      <p>${subtitle}</p>
    `;
    document.body.appendChild(div);
    throw new Error('access denied');
  }

  // =====================================================
  //   СОСТОЯНИЕ И РЕНДЕР
  // =====================================================
  const queue = []; // { id, url, createdAt, uploaderId }
  let processing = false;

  function render() {
    queueCountEl.textContent = queue.length;

    if (queue.length === 0) {
      emptyState.style.display = 'flex';
      photoFrame.classList.remove('visible');
      photoImg.src = '';
      btnReject.disabled = true;
      btnApprove.disabled = true;
      return;
    }

    emptyState.style.display = 'none';
    photoFrame.classList.add('visible');
    const current = queue[0];
    if (photoImg.dataset.id !== current.id) {
      photoImg.src = current.url;
      photoImg.dataset.id = current.id;
    }
    btnReject.disabled = false;
    btnApprove.disabled = false;
  }

  // =====================================================
  //   ФИЛЬТРАЦИЯ ПО СТЕНДУ
  // =====================================================
  // Фото привязано к стенду через поле uploaderId
  // (оно приходит со страницы /upload/:id → сервер сохраняет его).
  // Если uploaderId не задан — показываем всем модераторам.
  function belongsToStand(item) {
    if (!item.uploaderId) return true; // «общее» фото без привязки
    return String(item.uploaderId) === String(STAND);
  }

  // =====================================================
  //   ЗАГРУЗКА НАЧАЛЬНОЙ ОЧЕРЕДИ
  // =====================================================
  async function loadInitialQueue() {
    try {
      const r = await fetch('/api/pending/' + encodeURIComponent(TOKEN));
      if (r.status === 403) {
        showAccessDenied('Доступ запрещён', 'Неверный секрет модерации');
        return;
      }
      const data = await r.json();
      if (data.ok) {
        queue.length = 0;
        data.items
          .filter(belongsToStand)
          .forEach(it => queue.push(it));
        render();
      }
    } catch (e) {
      console.error('queue load error', e);
    }
  }

  // =====================================================
  //   ДЕЙСТВИЯ (approve / reject)
  // =====================================================
  async function moderate(action) {
    if (processing || queue.length === 0) return;
    const current = queue[0];
    processing = true;
    btnReject.disabled = true;
    btnApprove.disabled = true;

    try {
      const r = await fetch('/api/moderate/' + encodeURIComponent(TOKEN), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: current.id, action })
      });
      const data = await r.json();
      if (data.ok) {
        removeFromQueue(current.id);
      } else {
        alert('Ошибка: ' + (data.error || 'неизвестно'));
      }
    } catch (e) {
      console.error(e);
      alert('Сеть недоступна');
    } finally {
      processing = false;
      render();
    }
  }

  const approve = () => moderate('approve');
  const reject  = () => moderate('reject');

  function removeFromQueue(id) {
    const idx = queue.findIndex(it => it.id === id);
    if (idx >= 0) queue.splice(idx, 1);
  }

  btnApprove.addEventListener('click', approve);
  btnReject .addEventListener('click', reject);

  // =====================================================
  //   ГОРЯЧИЕ КЛАВИШИ
  // =====================================================
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'ArrowRight' || e.code === 'Enter') {
      e.preventDefault(); approve();
    }
    if (e.code === 'ArrowLeft' || e.code === 'Delete' || e.code === 'Backspace') {
      e.preventDefault(); reject();
    }
  });

  // =====================================================
  //   WEBSOCKET
  // =====================================================
  let ws = null;
  let reconnectTimer = null;

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${proto}//${location.host}/?role=admin&token=${encodeURIComponent(TOKEN)}`;
    ws = new WebSocket(url);

    ws.addEventListener('open', () => {
      connDot.className = 'dot on';
      connText.textContent = 'онлайн';
    });

    ws.addEventListener('close', () => {
      connDot.className = 'dot off';
      connText.textContent = 'оффлайн';
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectWS, 1500);
    });

    ws.addEventListener('error', () => {
      try { ws.close(); } catch(_) {}
    });

    ws.addEventListener('message', (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch(_) { return; }

      // Новое фото на модерации
      if (msg.type === 'new_pending' && msg.item) {
        if (!belongsToStand(msg.item)) return;           // не наш стенд
        if (queue.find(q => q.id === msg.item.id)) return; // уже есть
        queue.push(msg.item);
        showToast('📸 Новое фото в очереди');
        render();
        return;
      }

      // Кто-то обработал (в т.ч. другой модератор того же стенда)
      if (msg.type === 'moderated' && msg.id) {
        removeFromQueue(msg.id);
        render();
        return;
      }
    });
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // =====================================================
  //   СТАРТ
  // =====================================================
  loadInitialQueue();
  connectWS();
</script>

</body>
</html>
