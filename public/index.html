<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Фото-коллаж · Участник</title>
  <style>
    :root {
      --bg-1: #0b0f1a;
      --bg-2: #131a2b;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-strong: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
      --accent: #4f8cff;
      --accent-2: #8a5cff;
      --ok: #3ddc97;
      --err: #ff5c7a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius: 16px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 800px at 20% -10%, #1b2550 0%, transparent 60%),
                  radial-gradient(1000px 700px at 120% 10%, #3a1d6b 0%, transparent 60%),
                  linear-gradient(180deg, var(--bg-1), var(--bg-2));
      min-height: 100svh;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 4px 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .brand .logo {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent));
      box-shadow: var(--shadow);
    }
    .stand-badge {
      font-size: 12px;
      color: var(--text-dim);
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      letter-spacing: 0.2px;
    }
    .sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .dropzone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 22px;
      text-align: center;
      transition: border-color .2s, background .2s;
      background: rgba(255, 255, 255, 0.02);
    }
    .dropzone.drag { border-color: var(--accent); background: rgba(79, 140, 255, 0.08); }
    .dropzone .hint { color: var(--text-dim); font-size: 14px; margin-top: 8px; }

    .row {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-top: 14px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .06s ease, background .2s, border-color .2s;
    }
    .btn:hover { background: rgba(255,255,255,0.16); }
    .btn:active { transform: translateY(1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }
    .btn.primary:hover { filter: brightness(1.05); }
    .btn[disabled] { opacity: 0.55; cursor: not-allowed; }

    .preview {
      margin-top: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .preview.show { display: flex; }
    .preview .imgbox {
      position: relative;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      aspect-ratio: 4 / 3;
    }
    .preview img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    .caption-row {
      display: flex; gap: 10px; align-items: center;
    }
    input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, background .2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      background: rgba(79, 140, 255, 0.08);
    }
    .counter {
      color: var(--text-dim);
      font-size: 12px;
      min-width: 44px;
      text-align: right;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      min-height: 20px;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.muted { color: var(--text-dim); }

    .progress {
      margin-top: 10px;
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }
    .progress.show { display: block; }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .2s ease;
    }

    footer.bottom {
      color: var(--text-dim);
      text-align: center;
      font-size: 12px;
      padding: 18px 0 0;
    }

    @media (max-width: 420px) {
      h1 { font-size: 20px; }
      .btn { padding: 11px 14px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>Фото-коллаж</div>
      </div>
      <div id="stand-badge" class="stand-badge" style="display:none;"></div>
    </header>

    <div class="card">
      <h1>Отправьте фото</h1>
      <div class="sub">Сделайте снимок или выберите из галереи. При желании добавьте подпись.</div>

      <label id="dropzone" class="dropzone" for="file" tabindex="0" aria-label="Добавить фото">
        <div><strong>Нажмите, чтобы выбрать фото</strong> или перетащите сюда</div>
        <div class="hint">JPEG/PNG · до 12 МБ</div>
        <input id="file" type="file" accept="image/*" capture="environment" hidden />
      </label>

      <div id="preview" class="preview">
        <div class="imgbox">
          <img id="preview-img" alt="Превью" />
        </div>

        <div class="caption-row">
          <input id="caption" type="text" placeholder="Подпись (необязательно)" maxlength="15" />
          <div id="counter" class="counter">0/15</div>
        </div>

        <div class="row">
          <button id="btn-send" class="btn primary" type="button">Отправить</button>
          <button id="btn-reset" class="btn" type="button">Отменить</button>
        </div>

        <div class="progress" id="progress"><div></div></div>
      </div>

      <div id="status" class="status muted" aria-live="polite"></div>
    </div>

    <footer class="bottom">
      © Фото-коллаж · Мероприятие
    </footer>
  </div>

  <script>
  (() => {
    'use strict';

    // === ID стенда из URL (/upload/1 → "1") ===
    const STAND_MATCH = location.pathname.match(/^\/upload\/([a-zA-Z0-9_-]{1,32})$/);
    const UPLOADER_ID = STAND_MATCH ? STAND_MATCH[1] : null;
    console.log('[upload] stand id =', UPLOADER_ID);

    // === Константы ===
    const MAX_CAPTION = 15;
    const MAX_BYTES = 12 * 1024 * 1024; // 12 MB
    const ACCEPTED = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];

    // === Элементы ===
    const $file = document.getElementById('file');
    const $drop = document.getElementById('dropzone');
    const $preview = document.getElementById('preview');
    const $previewImg = document.getElementById('preview-img');
    const $caption = document.getElementById('caption');
    const $counter = document.getElementById('counter');
    const $send = document.getElementById('btn-send');
    const $reset = document.getElementById('btn-reset');
    const $status = document.getElementById('status');
    const $progress = document.getElementById('progress');
    const $progressBar = $progress.querySelector('div');
    const $standBadge = document.getElementById('stand-badge');

    // Бейдж стенда
    if (UPLOADER_ID) {
      $standBadge.textContent = 'Стенд № ' + UPLOADER_ID;
      $standBadge.style.display = '';
    }

    // === Состояние ===
    let currentBlob = null;
    let currentObjectUrl = null;
    let sending = false;

    // === Утилиты ===
    function setStatus(text, cls) {
      $status.textContent = text || '';
      $status.className = 'status ' + (cls || 'muted');
    }

    function resetAll() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      currentBlob = null;
      $previewImg.removeAttribute('src');
      $preview.classList.remove('show');
      $file.value = '';
      $caption.value = '';
      updateCounter();
      $progress.classList.remove('show');
      $progressBar.style.width = '0%';
      sending = false;
      $send.disabled = false;
      $reset.disabled = false;
      setStatus('', 'muted');
    }

    function updateCounter() {
      const len = $caption.value.length;
      $counter.textContent = len + '/' + MAX_CAPTION;
    }

    function isImageFile(file) {
      if (!file) return false;
      if (file.type && ACCEPTED.includes(file.type)) return true;
      if (file.type && file.type.startsWith('image/')) return true;
      return /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '');
    }

    async function readImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          resolve(img);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Не удалось прочитать изображение'));
        };
        img.src = url;
      });
    }

    // Сжатие до JPEG ~ max 2048 по большей стороне, качество 0.86
    async function compressImage(file) {
      try {
        const img = await readImage(file);
        const maxSide = 2048;
        let { naturalWidth: w, naturalHeight: h } = img;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        const tw = Math.max(1, Math.round(w * scale));
        const th = Math.max(1, Math.round(h * scale));

        const canvas = document.createElement('canvas');
        canvas.width = tw;
        canvas.height = th;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, tw, th);

        const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.86));
        if (!blob) throw new Error('Сжатие не удалось');
        return blob;
      } catch (e) {
        // Фоллбек — возвращаем исходник
        return file;
      }
    }

    // === Обработчики выбора файла ===
    $drop.addEventListener('click', () => $file.click());
    $drop.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        $file.click();
      }
    });

    ['dragenter', 'dragover'].forEach(ev =>
      $drop.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        $drop.classList.add('drag');
      })
    );
    ['dragleave', 'drop'].forEach(ev =>
      $drop.addEventListener(ev, (e) => {
        e.preventDefault();
        e.stopPropagation();
        $drop.classList.remove('drag');
      })
    );
    $drop.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if (file) handleFile(file);
    });

    $file.addEventListener('change', () => {
      const file = $file.files?.[0];
      if (file) handleFile(file);
    });

    async function handleFile(file) {
      if (!isImageFile(file)) {
        setStatus('Выберите изображение (JPEG/PNG).', 'err');
        return;
      }
      if (file.size > MAX_BYTES) {
        setStatus('Файл слишком большой. Максимум 12 МБ.', 'err');
        return;
      }

      setStatus('Готовим изображение…', 'muted');

      // Для превью — пробуем сжать, чтобы не тормозило на телефонах
      const blob = await compressImage(file);
      currentBlob = blob;

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(blob);
      $previewImg.src = currentObjectUrl;

      $preview.classList.add('show');
      setStatus('Готово к отправке.', 'ok');
    }

    // === Подпись ===
    $caption.addEventListener('input', () => {
      if ($caption.value.length > MAX_CAPTION) {
        $caption.value = $caption.value.slice(0, MAX_CAPTION);
      }
      updateCounter();
    });

    // === Сброс ===
    $reset.addEventListener('click', () => {
      if (sending) return;
      resetAll();
    });

    // === Отправка ===
    $send.addEventListener('click', async () => {
      if (sending) return;
      if (!currentBlob) {
        setStatus('Сначала выберите фото.', 'err');
        return;
      }

      sending = true;
      $send.disabled = true;
      $reset.disabled = true;
      setStatus('Отправляем…', 'muted');
      $progress.classList.add('show');
      $progressBar.style.width = '0%';

      try {
        const fd = new FormData();
        fd.append('photo', currentBlob, 'photo.jpg');
        const caption = ($caption.value || '').trim();
        if (caption) fd.append('caption', caption);
        if (UPLOADER_ID) fd.append('uploaderId', UPLOADER_ID);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload', true);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = Math.round((e.loaded / e.total) * 100);
            $progressBar.style.width = pct + '%';
          }
        };

        const done = new Promise((resolve, reject) => {
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(xhr.responseText);
            } else {
              reject(new Error('HTTP ' + xhr.status + ': ' + xhr.responseText));
            }
          };
          xhr.onerror = () => reject(new Error('Сетевая ошибка'));
          xhr.onabort = () => reject(new Error('Отправка отменена'));
        });

        xhr.send(fd);
        await done;

        $progressBar.style.width = '100%';
        setStatus('Фото отправлено! Спасибо 🙌', 'ok');

        // Авто-сброс через 1.2с, чтобы можно было сразу отправить ещё
        setTimeout(() => {
          resetAll();
        }, 1200);
      } catch (err) {
        console.error(err);
        setStatus('Не удалось отправить: ' + (err?.message || 'ошибка'), 'err');
        $progress.classList.remove('show');
        $progressBar.style.width = '0%';
        sending = false;
        $send.disabled = false;
        $reset.disabled = false;
      }
    });

    // Инициализация
    updateCounter();
  })();
  </script>
</body>
</html>
